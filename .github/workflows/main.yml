name: Build Capri
on:
  push:
  workflow_dispatch:
defaults:
  run:
    working-directory: capri-fabric-26.2-source/capri-fabric
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: capri-mod
          path: capri-fabric-26.2-source/capri-fabric/build/libs/*.jar
